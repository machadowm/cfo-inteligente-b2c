services:
  db:
    image: postgres:15-alpine
    container_name: cfo_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cfo_b2c}
      TZ: America/Sao_Paulo
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # Blindagem L4: Acesso apenas através do host local
      - "127.0.0.1:5432:5432"
    networks:
      - cfo_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: cfo_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    ports:
      # Blindagem L4: Acesso apenas através do host local
      - "127.0.0.1:6379:6379"
    networks:
      - cfo_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio
    container_name: cfo_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
    ports:
      # Blindagem L4: Se precisar de acesso público direto (ex: gerar links de imagens) 
      # para a internet, remova o "127.0.0.1:" destes portos.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - cfo_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  fastapi:
    build:
      context: ./backend
    container_name: cfo_fastapi
    restart: always
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@cfo_postgres:5432/${POSTGRES_DB:-cfo_b2c}
      - REDIS_URL=redis://cfo_redis:6379/0
      - MINIO_URL=http://cfo_minio:9000
      - TZ=America/Sao_Paulo
      # Rotas Internas Críticas Resolvidas
      - EVOLUTION_API_URL=http://cfo_evolution:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
    ports:
      # Exposto externamente para receber requisições se não houver um Nginx na frente
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    networks:
      - cfo_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  evolution_api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: cfo_evolution
    restart: always
    depends_on:
      - db
      - redis
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - SERVER_PORT=8080
      - SERVER_URL=${EVOLUTION_SERVER_URL}
      - AUTH_TYPE=apikey
      - AUTH_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@cfo_postgres:5432/${POSTGRES_DB:-cfo_b2c}?schema=evolution
      - CACHE_PROVIDER=redis
      - CACHE_REDIS_URI=redis://cfo_redis:6379/1
      - DEL_INSTANCE=false
      - CONFIG_SESSION_PHONE=false
      - LOG_LEVEL=ERROR
      - TZ=America/Sao_Paulo
    ports:
      # Exposto para que o WhatsApp web comunique
      - "8080:8080"
    networks:
      - cfo_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cfo_network:
    driver: bridge
