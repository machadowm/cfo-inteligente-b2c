services:
  db:
    image: postgres:15-alpine
    container_name: cfo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cfo_b2c}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-v6.sql:/docker-entrypoint-initdb.d/init.sql:ro # ALINHAMENTO: Usa o schema mestre v6 com travas e colunas corretas
    ports:
      # Blindagem L4: Acesso apenas através do host local
      - "127.0.0.1:5432:5432"
    networks:
      - cfo_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-cfo_b2c}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: cfo_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      # Blindagem L4: Acesso apenas através do host local
      - "127.0.0.1:6379:6379"
    networks:
      - cfo_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z # Tag fixada para evitar breaking changes do latest
    container_name: cfo_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      # Blindagem L4: MinIO isolado internamente para acesso seguro via FastAPI
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - cfo_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  fastapi:
    build:
      context: ./backend
    container_name: cfo_fastapi
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy # Sincronização de inicialização física
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cfo_b2c} # Uso do DNS interno do serviço (db)
      - REDIS_URL=redis://redis:6379/0 # Uso do DNS interno do serviço (redis)
      - MINIO_URL=http://minio:9000
      - TZ=America/Sao_Paulo
      - EVOLUTION_API_URL=http://evolution_api:8080 # Ajustado para o nome do serviço interno da rede Docker
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
    ports:
      - "8000:8000"
    networks:
      - cfo_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  evolution_api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: cfo_evolution
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - SERVER_PORT=8080
      - SERVER_URL=${EVOLUTION_SERVER_URL}
      - AUTH_TYPE=apikey
      - AUTH_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cfo_b2c}?schema=evolution # Uso de DNS interno
      - CACHE_PROVIDER=redis
      - CACHE_REDIS_URI=redis://redis:6379/1 # Uso de DNS interno
      - DEL_INSTANCE=false
      - CONFIG_SESSION_PHONE=false
      - LOG_LEVEL=ERROR
      - TZ=America/Sao_Paulo
    ports:
      - "8080:8080"
    networks:
      - cfo_network
    dns:
      - 8.8.8.8
      - 1.1.1.1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  cfo_network:
    driver: bridge
    driver_opts:
      # Otimização crucial: Impede estouros e timeouts de pacotes no Hyper-V
      com.docker.network.driver.mtu: 1350
