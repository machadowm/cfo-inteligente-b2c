services:
  db:
    image: postgres:15-alpine
    container_name: cfo_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: strong_password_here
      POSTGRES_DB: cfo_b2c
      TZ: America/Sao_Paulo
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - cfo_network

  redis:
    image: redis:7-alpine
    container_name: cfo_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - cfo_network

  minio:
    image: minio/minio
    container_name: cfo_minio
    restart: always
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: strong_password_here
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - cfo_network

  fastapi:
    build:
      context: ./backend
    container_name: cfo_fastapi
    restart: always
    depends_on:
      - db
      - redis
      - minio
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://admin:strong_password_here@cfo_postgres:5432/cfo_b2c
      - REDIS_URL=redis://cfo_redis:6379/0
      - MINIO_URL=http://cfo_minio:9000
      - TZ=America/Sao_Paulo
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    networks:
      - cfo_network

  evolution_api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: cfo_evolution
    restart: always
    depends_on:
      - db
      - redis
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTH_TYPE=apikey
      - AUTH_API_KEY=evolution_secret_key
      - AUTHENTICATION_API_KEY=evolution_secret_key
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://admin:strong_password_here@cfo_postgres:5432/cfo_b2c?schema=evolution
      - CACHE_PROVIDER=redis
      - CACHE_REDIS_URI=redis://cfo_redis:6379/1
      - DEL_INSTANCE=false
      - CONFIG_SESSION_PHONE=false
      - LOG_LEVEL=ERROR
      - TZ=America/Sao_Paulo
    ports:
      - "8080:8080"
    networks:
      - cfo_network
    dns:
      - 8.8.8.8
      - 1.1.1.1

networks:
  cfo_network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1350
